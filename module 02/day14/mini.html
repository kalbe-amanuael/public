<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethiopian Interface Layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 1. Grid Skeleton Container -->
    <div class="page-container">
      <!-- 4. Sticky Header -->
      <header class="main-header">
        <div class="logo">EthioDash</div>
        <!-- 2. Flexbox Navbar Component -->
        <nav class="navbar">
          <a href="#">Dashboard</a>
          <a href="#">Services</a>
          <a href="#">Profile</a>
        </nav>
      </header>

      <aside class="sidebar">
        <h3>Navigation</h3>
        <ul>
          <li>Overview</li>
          <li>Payments</li>
          <li>History</li>
        </ul>
      </aside>

      <main class="main-content">
        <h2>Account Summary</h2>

        <!-- 3. Responsive Card Grid -->
        <div class="card-grid">
          <!-- 5. Relative Parent for Absolute Badge -->
          <div class="card relative-parent">
            <span class="badge">Active</span>
            <h3>Balance</h3>
            <p>500 ETB</p>
          </div>
          <div class="card">
            <h3>Data Left</h3>
            <p>15 GB</p>
          </div>
          <div class="card">
            <h3>Voice Minutes</h3>
            <p>120 Min</p>
          </div>
        </div>
      </main>

      <footer class="main-footer">
        <p>&copy; 2026 Rebuilt Dashboard Layout</p>
      </footer>
    </div>
  </body>
</html>
